name: Build and Publish White-Label Windows

on:
  workflow_dispatch:
  push:
    branches:
      - white-label

permissions:
  contents: write

jobs:
  release-windows-white-label:
    name: Release Windows White-Label
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    if: github.repository == '98624017/comfyui-banana-li' && github.ref == 'refs/heads/white-label' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools Cython

    - name: Prepare white-label workspace
      run: |
        python .github/scripts/prepare_white_label_release.py
        python .github/scripts/prepare_white_label_release.py --check

    - name: Build extensions
      run: |
        python setup.py build_ext --inplace

    - name: Clean Source Code
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python -c "
        import os
        import shutil
        import stat

        def remove_readonly(func, path, _):
            os.chmod(path, stat.S_IWRITE)
            func(path)
        
        DIRS_TO_REMOVE = {'build', '.agent', '.git', '.vscode', '.idea', '.serena', '.superpowers', '.test', '.doc', 'openspec', '__pycache__', 'dist', 'tests'}
        DIRS_TO_SKIP = {'sam_hq', '.github'}
        FILES_TO_KEEP = {'setup.py', '__init__.py', 'loader_bootstrap.py', 'blendmodes.py', 'imagefunc.py', 'requirements.txt', 'workflow_parallel.py', 'video_task_manager.py'}
        
        for root, dirs, files in os.walk('.', topdown=True):
            for d in list(dirs):
                if d in DIRS_TO_REMOVE:
                    path = os.path.join(root, d)
                    print(f'Removing directory: {path}')
                    shutil.rmtree(path, onerror=remove_readonly)
                    dirs.remove(d)
                elif d in DIRS_TO_SKIP:
                    print(f'Skipping directory (preserving content): {d}')
                    dirs.remove(d)
            
            for file in files:
                file_path = os.path.join(root, file)
                if file.endswith('.md'):
                    if file.lower() != 'readme.md':
                        print(f'Deleting MD: {file}')
                        os.remove(file_path)
                    continue
                if file.endswith(('.py', '.c', '.cpp', '.h')):
                    if file in FILES_TO_KEEP:
                        continue
                    print(f'Deleting source: {file}')
                    os.remove(file_path)
        "

    - name: Verify white-label workspace after cleanup
      run: |
        python .github/scripts/prepare_white_label_release.py --check

    - name: Verify Binaries
      run: |
        if [ -z "$(find . -name '*.pyd' -print -quit)" ]; then
          echo "Error: No .pyd binaries found!"
          exit 1
        fi

    - name: Prepare Repository
      run: |
        rm -rf tools
        rm -f .github/workflows/publish_to_dev.yml
        rm -f .github/workflows/publish_white_label_windows.yml
        rm -rf .git
        rm -f setup.py
        rm -f history.toml history.toml.lock
        rm -f config.ini
        rm -f reproduce_*.py reproduce_*.pyd poll_manual.py poll_manual.pyd

        VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Push to White-Label Branch
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        TARGET_REPO: "98624017/comfyui-banana-li"
        TARGET_BRANCH: "white-label"
      run: |
        git init
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git remote add origin "https://x-access-token:${PUBLIC_REPO_TOKEN:-$GITHUB_TOKEN}@github.com/${TARGET_REPO}.git"

        if git fetch --depth=2 origin "${TARGET_BRANCH}" 2>/dev/null; then
          git branch "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          git symbolic-ref HEAD "refs/heads/${TARGET_BRANCH}"
          git reset
        else
          git checkout -b "${TARGET_BRANCH}"
        fi

        git add .
        if git diff-index --quiet HEAD --; then
          echo "No changes."
        else
          git commit -m "[skip ci] Automated white-label release v${{ env.VERSION }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin "${TARGET_BRANCH}"
        fi

name: Build and Publish to Dev

on:
  workflow_dispatch:

jobs:
  release-windows:
    name: Release Windows (Dev)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools Cython

    - name: Build extensions
      run: |
        python setup.py build_ext --inplace

    - name: Clean Source Code
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python -c "
        import os
        import shutil
        import stat

        def remove_readonly(func, path, _):
            os.chmod(path, stat.S_IWRITE)
            func(path)
        
        DIRS_TO_REMOVE = {'build', '.agent', '.git', '.vscode', '.idea', '.serena', '.test', '.doc', 'openspec', '__pycache__', 'dist', 'tests'}
        DIRS_TO_SKIP = {'sam_hq', '.github'}
        FILES_TO_KEEP = {'setup.py', '__init__.py', 'loader_bootstrap.py', 'blendmodes.py', 'imagefunc.py', 'requirements.txt', 'workflow_parallel.py', 'video_task_manager.py'}
        
        for root, dirs, files in os.walk('.', topdown=True):
            for d in list(dirs):
                if d in DIRS_TO_REMOVE:
                    path = os.path.join(root, d)
                    print(f'Removing directory: {path}')
                    shutil.rmtree(path, onerror=remove_readonly)
                    dirs.remove(d)
                elif d in DIRS_TO_SKIP:
                    print(f'Skipping directory (preserving content): {d}')
                    dirs.remove(d)
            
            for file in files:
                file_path = os.path.join(root, file)
                if file.endswith('.md'):
                    if file.lower() != 'readme.md':
                        print(f'Deleting MD: {file}')
                        os.remove(file_path)
                    continue
                if file.endswith(('.py', '.c', '.cpp', '.h')):
                    if file in FILES_TO_KEEP: continue
                    print(f'Deleting source: {file}')
                    os.remove(file_path)
        "

    - name: Verify Binaries
      run: |
        if [ -z "$(find . -name '*.pyd' -print -quit)" ]; then
          echo "Error: No .pyd binaries found!"
          exit 1
        fi

    - name: Prepare Repository
      run: |
        # 仅保留 Windows 二进制 (.pyd)
        find . -name "*.so" -delete

        # 清理开发工具和元数据
        rm -rf tools
        rm -f .github/workflows/publish_to_dev.yml
        rm -rf .git
        rm -f setup.py

        # 移除含敏感数据的运行时文件
        rm -f history.toml history.toml.lock
        rm -f config.ini

        # 移除调试/复现脚本（可能含硬编码密钥）
        rm -f reproduce_*.py reproduce_*.pyd poll_manual.py poll_manual.pyd

        # 获取版本号
        VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Push to Windows Repo
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        TARGET_REPO: "98624017/comfyui-banana-li"
      run: |
        git init
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git remote add origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${TARGET_REPO}.git"

        # 浅克隆最近 2 个提交，新提交后保持仓库仅含 3 个版本历史
        if git fetch --depth=2 origin dev 2>/dev/null; then
          git branch dev origin/dev
          git symbolic-ref HEAD refs/heads/dev
          git reset
        else
          git checkout -b dev
        fi

        git add .
        if git diff-index --quiet HEAD --; then
          echo "No changes."
        else
          git commit -m "Automated build release v${{ env.VERSION }} $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin dev
        fi

  release-linux:
    name: Release Linux (Main)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools Cython

    - name: Build extensions
      run: |
        python setup.py build_ext --inplace

    - name: Rename Artifacts (Strip abi3)
      run: |
        python -c "
        import os
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.so'):
                    parts = file.split('.')
                    if len(parts) > 2:
                        new_name = parts[0] + '.so'
                        old_path = os.path.join(root, file)
                        new_path = os.path.join(root, new_name)
                        if old_path != new_path:
                            print(f'Renaming {file} -> {new_name}')
                            os.rename(old_path, new_path)
        "

    - name: Clean Source Code
      run: |
        python -c "
        import os
        import shutil
        
        DIRS_TO_REMOVE = {'build', '.agent', '.git', '.vscode', '.idea', '.serena', '.test', '.doc', 'openspec', '__pycache__', 'dist', 'tests'}
        DIRS_TO_SKIP = {'sam_hq', '.github'}
        FILES_TO_KEEP = {'setup.py', '__init__.py', 'loader_bootstrap.py', 'blendmodes.py', 'imagefunc.py', 'requirements.txt', 'workflow_parallel.py', 'video_task_manager.py'}
        
        for root, dirs, files in os.walk('.', topdown=True):
            for d in list(dirs):
                if d in DIRS_TO_REMOVE:
                    path = os.path.join(root, d)
                    print(f'Removing directory: {path}')
                    shutil.rmtree(path)
                    dirs.remove(d)
                elif d in DIRS_TO_SKIP:
                    print(f'Skipping directory (preserving content): {d}')
                    dirs.remove(d)
            
            for file in files:
                file_path = os.path.join(root, file)
                if file.endswith('.md'):
                    if file.lower() != 'readme.md':
                        print(f'Deleting MD: {file}')
                        os.remove(file_path)
                    continue
                if file.endswith(('.py', '.c', '.cpp', '.h')):
                    if file in FILES_TO_KEEP: continue
                    print(f'Deleting source: {file}')
                    os.remove(file_path)
        "

    - name: Verify Binaries
      run: |
        if [ -z "$(find . -name '*.so' -print -quit)" ]; then
          echo "Error: No .so binaries found!"
          exit 1
        fi

    - name: Prepare Repository
      run: |
        # 修改 pyproject.toml
        sed -i 's/comfyui-banana-li/comfyui-banana-li-linux/g' pyproject.toml
        sed -i 's/comfyui-banana-li/comfyui-banana-li-linux/g' .github/workflows/publish_action.yml || true

        # Remove dev workflow
        rm -f .github/workflows/publish_to_dev.yml

        # 清理
        rm -rf tools
        rm -rf .git
        rm -f setup.py
        find . -name "*.pyd" -delete

        # 移除含敏感数据的运行时文件
        rm -f history.toml history.toml.lock
        rm -f config.ini

        # 移除调试/复现脚本（可能含硬编码密钥）
        rm -f reproduce_*.py reproduce_*.so poll_manual.py poll_manual.so

        # 获取版本号
        VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Push to Linux Repo
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        TARGET_REPO: "98624017/comfyui-banana-li-linux"
      run: |
        git init
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git remote add origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${TARGET_REPO}.git"

        # 浅克隆最近 2 个提交，新提交后保持仓库仅含 3 个版本历史
        if git fetch --depth=2 origin main 2>/dev/null; then
          git branch main origin/main
          git symbolic-ref HEAD refs/heads/main
          git reset
        else
          git checkout -b main
        fi

        git add .
        # Force add .so if they are ignored
        find . -name "*.so" -exec git add -f {} +

        if git diff-index --quiet HEAD --; then
          echo "No changes."
        else
          git commit -m "Automated build release v${{ env.VERSION }} (Linux)"
          git push --force origin main
        fi

  release-mac:
    name: Release Mac (Main)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools Cython

    - name: Build extensions
      run: |
        python setup.py build_ext --inplace

    - name: Rename Mac Artifacts (Strip ABI tags)
      run: |
        python -c "
        import os
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.so'):
                    parts = file.split('.')
                    if len(parts) > 2:
                        new_name = parts[0] + '.so'
                        old_path = os.path.join(root, file)
                        new_path = os.path.join(root, new_name)
                        if old_path != new_path:
                            print(f'Renaming {file} -> {new_name}')
                            os.rename(old_path, new_path)
        "

    - name: Sign Mac Binaries (Ad-hoc)
      run: |
        find . -name "*.so" | while read f; do
          codesign -s - --force "$f"
          echo "Signed: $f"
        done

    - name: Clean Source Code
      run: |
        python -c "
        import os
        import shutil
        
        DIRS_TO_REMOVE = {'build', '.agent', '.git', '.vscode', '.idea', '.serena', '.test', '.doc', 'openspec', '__pycache__', 'dist', 'tests'}
        DIRS_TO_SKIP = {'sam_hq', '.github'}
        FILES_TO_KEEP = {'setup.py', '__init__.py', 'loader_bootstrap.py', 'blendmodes.py', 'imagefunc.py', 'requirements.txt', 'workflow_parallel.py', 'video_task_manager.py'}
        
        for root, dirs, files in os.walk('.', topdown=True):
            for d in list(dirs):
                if d in DIRS_TO_REMOVE:
                    path = os.path.join(root, d)
                    print(f'Removing directory: {path}')
                    shutil.rmtree(path)
                    dirs.remove(d)
                elif d in DIRS_TO_SKIP:
                    print(f'Skipping directory (preserving content): {d}')
                    dirs.remove(d)
            
            for file in files:
                file_path = os.path.join(root, file)
                if file.endswith('.md'):
                    if file.lower() != 'readme.md':
                        print(f'Deleting MD: {file}')
                        os.remove(file_path)
                    continue
                if file.endswith(('.py', '.c', '.cpp', '.h')):
                    if file in FILES_TO_KEEP: continue
                    print(f'Deleting source: {file}')
                    os.remove(file_path)
        "

    - name: Verify Binaries
      run: |
        if [ -z "$(find . -name '*.so' -print -quit)" ]; then
          echo "Error: No .so binaries found!"
          exit 1
        fi

    - name: Prepare Repository
      run: |
        # 修改 pyproject.toml
        sed -i '' 's/comfyui-banana-li/comfyui-banana-li-mac/g' pyproject.toml
        sed -i '' 's/comfyui-banana-li/comfyui-banana-li-mac/g' .github/workflows/publish_action.yml || true

        # Remove dev workflow
        rm -f .github/workflows/publish_to_dev.yml

        # 清理
        rm -rf tools
        rm -rf .git
        rm -f setup.py
        find . -name "*.pyd" -delete

        # 移除含敏感数据的运行时文件
        rm -f history.toml history.toml.lock
        rm -f config.ini

        # 移除调试/复现脚本（可能含硬编码密钥）
        rm -f reproduce_*.py reproduce_*.so poll_manual.py poll_manual.so

        # 获取版本号
        VERSION=$(grep -m 1 'version =' pyproject.toml | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Push to Mac Repo
      env:
        PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        TARGET_REPO: "98624017/comfyui-banana-li-mac"
      run: |
        git init
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git remote add origin "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${TARGET_REPO}.git"

        # 浅克隆最近 2 个提交，新提交后保持仓库仅含 3 个版本历史
        if git fetch --depth=2 origin main 2>/dev/null; then
          git branch main origin/main
          git symbolic-ref HEAD refs/heads/main
          git reset
        else
          git checkout -b main
        fi

        git add .
        # Force add .so
        find . -name "*.so" -exec git add -f {} +

        if git diff-index --quiet HEAD --; then
          echo "No changes."
        else
          git commit -m "Automated build release v${{ env.VERSION }} (Mac)"
          git push --force origin main
        fi

  cleanup:
    name: Cleanup Artifacts
    needs: [release-windows, release-linux, release-mac]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Delete Artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            compiled-windows-latest
            compiled-ubuntu-latest
            compiled-macos-latest
          failOnError: false
